steps:
  # 1. Inject custom environment variables and compile Angular production bundle
  - name: 'node:22'
    entrypoint: 'bash'
    dir: 'website/ui'
    env:
      - 'GTM_CONTAINER_ID=$_GTM_CONTAINER_ID'
      - 'GOOGLE_TAG_ID=$_GOOGLE_TAG_ID'
      - 'SGTM_ENDPOINT_URL=$_SGTM_ENDPOINT_URL'
      - 'SGTM_TAG_SERVING_URL=$_SGTM_TAG_SERVING_URL'
      - 'STAPE_TAG_SERVING_URL=$_STAPE_TAG_SERVING_URL'
      - 'APP_CURRENCY=$_CURRENCY'
      - 'APP_LOCAL_CODE=$_LOCAL_CODE'
    args:
      - '-c'
      - |
        node ./scripts/inject-env.js
        npm ci
        npm run build

  # 2. Deploy website to Google App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    dir: 'website'
    args:
      - '-c'
      - |
        gcloud app deploy app.yaml --project=$PROJECT_ID --quiet

substitutions:
  _GTM_CONTAINER_ID: 'GTM-XXXXX'
  _GOOGLE_TAG_ID: 'G-YYYYY'
  _SGTM_ENDPOINT_URL: 'https://example.com'
  _SGTM_TAG_SERVING_URL: 'https://www.googletagmanager.com'
  _STAPE_TAG_SERVING_URL: 'https://example.com'
  _CURRENCY: 'GBP'
  _LOCAL_CODE: 'en-GB'

options:
  logging: CLOUD_LOGGING_ONLY
